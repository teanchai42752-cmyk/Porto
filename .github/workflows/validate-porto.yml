name: PORTO validation

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/validate-porto.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/validate-porto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Financial model and UI smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run PORTO smoke tests
        run: node tests/porto-smoke.test.mjs
